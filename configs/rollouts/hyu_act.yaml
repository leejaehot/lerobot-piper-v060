profile:
  description: Hanyang lemon-to-red-plate · ACT chunk 100
  camera_aliases:
    front: egoview
    right: wristcam

policy:
  default: hyu_act
  checkpoints:
    hyu_act: outputs/policies/hyu/act_latest
  # Keep the checkpoint's trained execution horizon. Shorter replanning caused
  # target discontinuities and extra synchronous-inference stalls on Thor.
  n_action_steps: 100

rollout:
  task: Place the lemon on the red plate.

# Mean frame-0 observation.state over all 100 HYU training episodes. The HYU
# demonstrations did not start at Piper's official-home pose.
teleop_initial_pose:
  enabled: true
  speed_percent: 20
  timeout_seconds: 20
  joint_tolerance_degrees: 2
  gripper_tolerance_mm: 2
  normalized:
    joint1: 12.0339
    joint2: -47.0460
    joint3: 40.0324
    joint4: -0.0933
    joint5: 97.9505
    joint6: -4.0841
    gripper: 63.6307

arm:
  speed_percent: 20
  max_relative_target: 3

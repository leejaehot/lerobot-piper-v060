dataset:
  repo_id: local/piper_doubleport
  task: Put the object in the target container.
  episodes: 10
  episode_seconds: 60
  reset_seconds: 30
  push_to_hub: false

# Before episode 1, arrange objects on the live grid and press Enter.
initial_setup:
  wait_for_enter: true

# RealSense SDK serials from: lerobot-find-cameras realsense
cameras:
  egoview: "REPLACE_WITH_D435_SERIAL"
  wristcam: "REPLACE_WITH_D405_SERIAL"

# Object initial-pose guide. The corners are fractions of the egoview image,
# ordered top-left, top-right, bottom-right, bottom-left. Each initial pose is a
# fixed zero-based [column, row] point or four-corner box; no nearby poses are generated.
reset_grid:
  enabled: true
  camera: egoview
  columns: 16
  rows: 12
  corners:
    - [0.0, 0.0]
    - [1.0, 0.0]
    - [1.0, 1.0]
    - [0.0, 1.0]
  initial_poses:
    object: [4, 6]
    target_container: [[9, 3], [14, 3], [9, 9], [14, 9]]

capture:
  dataset_fps: 30
  control_fps: 200
  width: 640
  height: 480
  rerun: true
  # Raw is more reliable in the native Rerun viewer on Jetson. Enable JPEG only
  # when sending previews to a remote viewer and bandwidth matters.
  rerun_compress_images: false
  rerun_fps: 10

arm:
  leader_can: can_leader
  follower_can: can_follower
  speed_percent: 100
  # Home only the follower after each take; never command the leader home.
  # Recording stops if the follower is not home before the final countdown.
  home_on_reset: true
  home_speed_percent: 20
  home_tolerance_degrees: 2
  max_relative_target: 100
  # Smooth only the follower gripper; arm joints still use the full control rate.
  gripper_speed_mm_s: 80
  # 1..10; 5 balances hand effort and passive position holding on this setup.
  leader_gripper_friction: 5
  gripper_input_min: 1000
  gripper_input_max: 50000

# Three-pedal HID keyboard: Left Arrow / Space (next segment) / Right Arrow
annotations:
  segments: true
  segment_debounce_ms: 400

# Non-blocking local Korean WAV cues for record/teleop state changes.
audio:
  enabled: true

video:
  codec: h264
  preset: veryfast
  crf: 28
  keyframe_interval: 30
  encoder_threads: 2
  streaming: false
